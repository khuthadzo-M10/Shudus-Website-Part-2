<h1>Request a Quote</h1>

<p>
    Tell us about your plumbing or construction
    requirements.
</p>

<form>

    <label>Full Name *</label>

    <input type="text"
           name="name"
           required>


    <label>Phone Number *</label>

    <input type="tel"
           name="phone"
           required>


    <label>Email Address *</label>

    <input type="email"
           name="email"
           required>


    <label>Location *</label>

    <input type="text"
           name="location"
           required>


    <label>Service Required *</label>

    <select name="service" required>

        <option value="">
            Select a service
        </option>

        <option>
            Plumbing Services
        </option>

        <option>
            Solar Geyser Installation
        </option>

        <option>
            General Building
        </option>

        <option>
            Repairs & Maintenance
        </option>

        <option>
            Commercial Plumbing
        </option>

        <option>
            Residential Plumbing
        </option>

    </select>


    <label>Description of Work *</label>

    <textarea
        name="description"
        required>
    </textarea>


    <label>
        Upload Photos / Documents
    </label>

    <input
        type="file"
        accept="image/*,.pdf,.doc,.docx">


    <button type="submit"
            class="btn">

        SUBMIT QUOTE REQUEST

    </button>

</form>
